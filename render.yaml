services:
  - type: web
    name: patentgeyser-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard, never committed
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://patentgeyser.vercel.app
      - key: PATENTGEYSER_API_KEY
        sync: false # shared secret; the calling app must send it as the X-API-Key header
